  function title() {
    const bc = seg === 'bc';

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.save(); ctx.translate(-camX, 0);
    if (img.complete && img.naturalWidth) ctx.drawImage(img, 0, 0, SCROLL, H);
    const foot = camX + W / 2;
    ctx.fillStyle = '#7fd6ff';

  document.getElementById('speed').addEventListener('input', (e) => { speed = +e.target.value; });
  document.getElementById('seg').addEventListener('change', (e) => setSeg(e.target.value));
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { playing = !playing; document.getElementById('play').textContent = playing ? '暂停' : '播放'; e.preventDefault(); }
    else if (e.key === '1') setCam('A'); else if (e.key === '2') setCam('S'); else if (e.key === '3') setCam('B');
    else if (e.key.toLowerCase() === 'g') { showGuides = !showGuides; document.getElementById('guides').setAttribute('aria-pressed', String(showGuides)); }

    else if (e.key === 'ArrowRight') { playing = false; camX = clamp(camX + 24, 0, SCROLL - W); }
    else return;
    e.preventDefault();
  });
  img.addEventListener('load', () => { err.style.display = 'none'; });
  function tick(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
    if (playing) {
      camX += speed * dt;
      if (camX >= SCROLL - W) { camX = SCROLL - W; playing = false; document.getElementById('play').textContent = '播放'; }
    }
    draw(); requestAnimationFrame(tick);
  }
  const start = (new URLSearchParams(location.search).get('seg') || 'ab').toLowerCase();
  setSeg(start === 'bc' ? 'bc' : 'ab');
  requestAnimationFrame(tick);
