<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>留园 · 冠云峰前院试走</title><link rel="stylesheet" href="pixel-theme.css">
  <style>
    body{margin:0;background:#242c29;color:#e8e8db;font:15px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}
    main{max-width:1000px;margin:auto;padding:12px}header,.hud{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    h1{margin:5px 0 9px;font-size:1.22rem;font-weight:600;letter-spacing:.08em}a{color:#c0d5c2}.badge{color:#c6b99b;font-size:.78rem;letter-spacing:.15em}
    .stage{position:relative;border:3px solid #68756b;box-shadow:0 12px 38px #101713b0;overflow:hidden}canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
    .stage-note{position:absolute;left:12px;bottom:12px;max-width:440px;padding:7px 10px;background:#19251ed6;border:1px solid #68756b;font-size:.86rem}
    .hud{padding:11px 1px}#status{min-height:2em}label{white-space:nowrap}
    button{min-height:42px;padding:5px 12px;background:#d5d5c3;border:1px solid #9ca893;color:#26382c;font:inherit;border-radius:2px}
    .controls{display:grid;grid-template-columns:repeat(3,46px);gap:5px;width:max-content;touch-action:none}.controls button{padding:0}
    .controls button:first-child{grid-column:2}.controls button:nth-child(2){grid-column:1;grid-row:2}.controls button:nth-child(3){grid-column:2;grid-row:2}.controls button:nth-child(4){grid-column:3;grid-row:2}.controls button:nth-child(5){grid-column:3;grid-row:3}
    .footnote{margin:10px 0 0;color:#b6c2b5;font-size:.83rem}
  </style>
</head>
<body><main>
  <header><div><div class="badge">旧 v1 · 构图误差对照，非实景候选</div><h1>隔沼望石</h1></div>
    <nav><a href="liuyuan-guanyun-v2.html">看修订后的南厅 v2 ↗</a> · <a href="geometry-editor.html?scene=liuyuan-guanyun-court-study-v1">查看旧稿几何 ↗</a></nav></header>
  <div class="stage"><canvas id="scene" width="960" height="640" aria-label="留园冠云峰前院可行走研究场景；方向键或 WASD 移动，E 观察"></canvas><div class="stage-note" id="stageNote">绕着浣云沼走，停在岸边望石。</div></div>
  <div class="hud"><span id="status" role="status" aria-live="polite">走近水岸观石处或左右岸路，按 E。</span><label><input id="showGeometry" type="checkbox"> 显示可走地面、峰石碰撞和遮挡</label><span id="coords" hidden></span><button id="reset" type="button">回到前庭</button></div>
  <div class="controls" aria-label="触屏控制"><button data-dir="up" aria-label="向上">↑</button><button data-dir="left" aria-label="向左">←</button><button data-dir="down" aria-label="向下">↓</button><button data-dir="right" aria-label="向右">→</button><button id="look" aria-label="观察">看</button></div>
  <p class="footnote">旧稿缺少南侧林泉耆硕之馆的围合，北端冠云楼也画错层次，仅留草稿和误差对照。请看独立 v2；两个版本都不是清末园貌复原，也未接正式章节。</p>
</main><script src="dist/liuyuan-guanyun.js?v=3"></script></body>
</html>
