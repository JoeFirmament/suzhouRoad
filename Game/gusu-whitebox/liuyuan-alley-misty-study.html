<html lang="zh-CN"><head>

  <style>
    body{margin:0;background:#222b2d;color:#e4e8e5;font:15px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}

</head><body><main>
  <header><div><div class="badge">留园 · 门内夹弄 · 独立美术／几何研究</div><h1>石路转入窄巷</h1></div>
    <nav><a href="liuyuan-entry-gate-misty-study.html">回门墙研究 ↗</a> · <a href="geometry-editor.html?scene=liuyuan-alley-misty-study-v1">编辑本幕几何 ↗</a></nav></header>
