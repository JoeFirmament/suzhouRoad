    <!-- East to west in the source: hexagonal round, an uncertain turned glyph,
         octagon/begonia, begonia-pearl, sunflower and vine/ruyi. World east is
         +x, so mirror only the six motifs to read in that order right to left. -->
    <g transform="translate(864 0) scale(-1 1)">
    <path d="M381 189h6l3 5v12l-3 5h-6l-3-5v-12Z" fill="none" stroke="#3f4c43" stroke-width="2"/>
