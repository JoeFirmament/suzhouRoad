  <!-- Ancient-tree fore-corridor: six solid-window silhouettes. Suzhou Gazetteer
       records the current east-to-west motif sequence; these tiny original pixel
       readings are not tracings or claims about the 1890 joinery. The second
       motif's source glyph is incomplete, so its core stays an abstract turn. -->
  <g id="ancient-tree-six-windows">
    <path d="M368 172h128v52H368Z" fill="#d8d2c1"/>
    <path d="M368 173h128v5H368Z" fill="#9da194"/>
    <path d="M365 163h133v10H365Z" fill="url(#gate-eave)"/>
