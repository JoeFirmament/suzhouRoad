<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="688" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">留园入口空间拓扑校对图</title>
  <desc id="desc">依据现状入口空间层次资料归纳的制作简图，不是1890年测绘。主通道由南侧街面，经小门前厅、天井、狭长曲廊、第二小庭，到古木交柯及华步小筑，再经漏窗和绿荫轩临池。</desc>
  <rect width="1000" height="680" fill="#ebe8df"/>
  <path d="M 518 630 L 518 548 L 524 484 L 524 390 L 430 390 L 430 300 L 430 226 L 330 226 L 330 135" fill="none" stroke="#575d55" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 518 630 L 518 548 L 524 484 L 524 390 L 430 390 L 430 300 L 430 226 L 330 226 L 330 135" fill="none" stroke="#c6bfae" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#d9ded0" stroke="#637866" stroke-width="3">
    <rect x="470" y="510" width="100" height="70" rx="3"/>
    <rect x="476" y="444" width="95" height="60" rx="3"/>
    <rect x="379" y="347" width="100" height="78" rx="3"/>
    <rect x="380" y="270" width="100" height="62" rx="3"/>
    <rect x="279" y="183" width="100" height="86" rx="3"/>
  </g>
  <g fill="#ede3c8" stroke="#947343" stroke-width="3">
    <rect x="493" y="591" width="50" height="38"/>
    <rect x="400" y="340" width="60" height="22"/>
    <rect x="306" y="157" width="48" height="30"/>
  </g>
  <g fill="none" stroke="#8c6b9b" stroke-width="4" stroke-dasharray="7 5">
    <rect x="482" y="574" width="72" height="20"/>
    <rect x="394" y="324" width="72" height="20"/>
    <rect x="300" y="174" width="60" height="20"/>
  </g>
  <g font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="19" fill="#303b36">
    <text x="572" y="628">南侧街面 · 小门／门房（CH3-03）</text>
    <text x="574" y="554">前厅与第一天井</text>
    <text x="575" y="455">狭长曲廊 · 暗（CH3-04）</text>
    <text x="520" y="374">转折与采光小庭</text>
    <text x="485" y="292">古木交柯／华步小筑相邻小景</text>
    <text x="385" y="212">隔漏窗窥园，不见全池</text>
    <text x="383" y="129">绿荫轩附近 · 临中部池</text>
  </g>
  <path d="M 321 133 L 260 88" stroke="#547a75" stroke-width="3" fill="none"/>
  <rect x="90" y="28" width="230" height="84" rx="8" fill="#a9bfba" stroke="#547a75" stroke-width="3"/>
  <text x="110" y="65" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="18" fill="#243a38">中部池园</text>
  <text x="110" y="91" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14" fill="#243a38">到此才完整展开</text>
  <g font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#584a63">
    <text x="625" y="80">紫色虚框：门位／历史形制待核</text>
    <text x="625" y="107">灰线：空间次序，不是测量路径</text>
    <text x="625" y="134">现状教学示意转译 · 不作 1890 测绘</text>
  </g>
  <text x="50" y="650" font-family="'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="15" fill="#655f54">制作门槛：先核平面与照片 → 再建可走白模 → 最后画分镜像素近景</text>
</svg>
